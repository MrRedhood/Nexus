name: Nexus Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: "APK variant to build"
        required: false
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: nexus-android-${{ github.ref }}-${{ github.event.inputs.build_variant || 'debug' }}
  cancel-in-progress: false

env:
  BUILD_VARIANT: ${{ github.event.inputs.build_variant || 'debug' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble APK
        run: gradle --no-daemon --stacktrace assemble${BUILD_VARIANT^}

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ env.BUILD_VARIANT }}-apk-${{ github.sha }}
          path: app/build/outputs/apk/${{ env.BUILD_VARIANT }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-test-reports-${{ github.sha }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
