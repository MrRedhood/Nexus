name: Nexus Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_target:
        description: "Android artifact to build"
        required: false
        default: debug
        type: choice
        options:
          - debug
          - release
          - aab

permissions:
  contents: write

concurrency:
  group: nexus-android-${{ github.ref }}-${{ github.event.inputs.build_target || 'debug' }}
  cancel-in-progress: false

env:
  BUILD_TARGET: ${{ github.event.inputs.build_target || 'debug' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Integrate project file tree and AI floating button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/mrredhood/nexus/MainActivity.kt")
          s = p.read_text()

          if "import kotlinx.coroutines.launch" not in s:
              s = s.replace(
                  "import com.mrredhood.nexus.core.workspace.WorkspaceEntry\n",
                  "import com.mrredhood.nexus.core.workspace.WorkspaceEntry\nimport kotlinx.coroutines.launch\n"
              )

          old_actions = 'IconButton(onClick = { showGit = true }) { Icon(Icons.Outlined.Source, "Source control") }; IconButton(onClick = { showAiChat = true }) { Icon(Icons.Outlined.AutoAwesome, "AI chat") }; IconButton(onClick = { vm.refresh(workspace) })'
          new_actions = 'IconButton(onClick = { showGit = true }) { Icon(Icons.Outlined.Source, "Source control") }; IconButton(onClick = { vm.refresh(workspace) })'
          s = s.replace(old_actions, new_actions, 1)

          ai_card = '            Card(Modifier.fillMaxWidth().padding(top = 10.dp), shape = MaterialTheme.shapes.large, colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceContainerHighest), onClick = { showAiChat = true }) { Row(Modifier.fillMaxWidth().padding(16.dp), horizontalArrangement = Arrangement.spacedBy(12.dp), verticalAlignment = androidx.compose.ui.Alignment.CenterVertically) { Icon(Icons.Outlined.AutoAwesome, "AI chat"); Column(Modifier.weight(1f)) { Text("Ask Nexus AI", style = MaterialTheme.typography.titleMedium); Text("Analyze, search, explain, fix, refactor or edit this workspace", style = MaterialTheme.typography.bodySmall) }; Icon(Icons.Outlined.ChevronRight, null) } }\n'
          s = s.replace(ai_card, '', 1)

          scaffold_end = '    }\n    }\n    createDialog?.let { type ->'
          replacement = '        }, floatingActionButton = {\n            FloatingActionButton(onClick = { showAiChat = true }) {\n                Icon(Icons.Outlined.AutoAwesome, "AI chat")\n            }\n        })\n    }\n    createDialog?.let { type ->'
          if scaffold_end not in s:
              raise SystemExit("Workspace scaffold end marker not found")
          s = s.replace(scaffold_end, replacement, 1)

          p.write_text(s)
          PY
          if git diff --quiet -- app/src/main/java/com/mrredhood/nexus/MainActivity.kt; then
            echo "UI integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/mrredhood/nexus/MainActivity.kt
          git commit -m "fix(ui): stabilize project tree and add AI FAB"
          git push

      - name: Assemble APK
        if: env.BUILD_TARGET == 'debug' || env.BUILD_TARGET == 'release'
        run: gradle --no-daemon --stacktrace assemble${BUILD_TARGET^}

      - name: Assemble AAB
        if: env.BUILD_TARGET == 'aab'
        run: gradle --no-daemon --stacktrace bundleRelease

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload APK artifact
        if: success() && (env.BUILD_TARGET == 'debug' || env.BUILD_TARGET == 'release')
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ env.BUILD_TARGET }}-apk-${{ github.sha }}
          path: app/build/outputs/apk/${{ env.BUILD_TARGET }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB artifact
        if: success() && env.BUILD_TARGET == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-release-aab-${{ github.sha }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-test-reports-${{ github.sha }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
