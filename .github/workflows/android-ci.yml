name: Nexus Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_target:
        description: "Android artifact to build"
        required: false
        default: debug
        type: choice
        options:
          - debug
          - release
          - aab

permissions:
  contents: read

concurrency:
  group: nexus-android-${{ github.ref }}-${{ github.event.inputs.build_target || 'debug' }}
  cancel-in-progress: false

env:
  BUILD_TARGET: ${{ github.event.inputs.build_target || 'debug' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble APK
        if: env.BUILD_TARGET == 'debug' || env.BUILD_TARGET == 'release'
        run: gradle --no-daemon --stacktrace assemble${BUILD_TARGET^}

      - name: Assemble AAB
        if: env.BUILD_TARGET == 'aab'
        run: gradle --no-daemon --stacktrace bundleRelease

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload APK artifact
        if: success() && (env.BUILD_TARGET == 'debug' || env.BUILD_TARGET == 'release')
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ env.BUILD_TARGET }}-apk-${{ github.sha }}
          path: app/build/outputs/apk/${{ env.BUILD_TARGET }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB artifact
        if: success() && env.BUILD_TARGET == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-release-aab-${{ github.sha }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-test-reports-${{ github.sha }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
